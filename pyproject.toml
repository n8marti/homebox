[build-system]
requires = ["flit_core <5"]
build-backend = "flit_core.buildapi"

[project]
name = "homebox"
description = "Manipulate MTN Homebox router"
readme = "README.md"
authors = [{name = "Nate Marti"}]
dependencies = [
    "selenium",
    "speedtest-cli-ng",
]
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]

[project.scripts]
homebox-get-bandwidth = "homebox.cli:get_bandwidth"
homebox-toggle-apn = "homebox.cli:toggle_apn"
homebox-verify-connection = "homebox.cli:main"
